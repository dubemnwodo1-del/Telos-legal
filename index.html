<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Telos — Legal &amp; support</title>
  <meta name="description" content="Privacy Policy, Terms of Service, and account deletion for the Telos app." />
  <style>
    :root { color-scheme: light dark; --bg: #f7f8fc; --card: #fff; --text: #182033; --muted: #586174; --accent: #0164fb; --border: rgba(24, 32, 51, 0.1); }
    @media (prefers-color-scheme: dark) { :root { --bg: #10131a; --card: #191e29; --text: #eef1f7; --muted: #9aa4b8; --border: rgba(238, 241, 247, 0.12); } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 48px 20px; }
    main { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 2.1rem; line-height: 1.15; margin: 0 0 8px; }
    p { color: var(--muted); }
    .links { display: grid; gap: 14px; margin-top: 28px; }
    a.card { display: block; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; text-decoration: none; color: var(--accent); }
    a.card strong { display: block; color: var(--text); font-size: 1.05rem; margin-bottom: 4px; }
    a.card span { color: var(--muted); font-size: 0.92rem; }
    footer { margin-top: 36px; font-size: 0.9rem; color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Telos</h1>
    <p>Legal and support pages for the Telos app.</p>

    <div class="links">
      <a class="card" href="privacy-policy.html">
        <strong>Privacy Policy</strong>
        <span>What Telos collects, why, and your choices.</span>
      </a>
      <a class="card" href="terms-of-service.html">
        <strong>Terms of Service</strong>
        <span>The terms that apply when you use Telos.</span>
      </a>
      <a class="card" href="delete-account.html">
        <strong>Delete your account</strong>
        <span>How to permanently delete your account and its data.</span>
      </a>
    </div>

    <footer>
      Questions? <a href="mailto:telos.tracker@gmail.com">telos.tracker@gmail.com</a>
    </footer>
  </main>
</body>
</html>
